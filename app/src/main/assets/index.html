<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestão HELP-TECH V3</title><style>
:root{font-family:Arial,sans-serif;color:#eaf2ff;background:#071b37}body{margin:0}header{padding:22px 16px;background:linear-gradient(120deg,#0b2953,#175a9c)}h1{font-size:21px;margin:0}small{color:#c3d4ed}main{padding:12px;max-width:800px;margin:auto}nav{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}button{background:#1885c0;color:white;border:0;border-radius:9px;padding:12px;font-size:15px}nav button{background:#153d6a}.panel{background:#102e53;padding:14px;border-radius:12px;margin:10px 0;border:1px solid #315b89}label{display:block;margin:10px 0 3px}input,select,textarea{box-sizing:border-box;width:100%;border:1px solid #6686a7;border-radius:8px;padding:11px;background:#fff;color:#111;font-size:16px}.hide{display:none}.item{border-bottom:1px solid #375d83;padding:12px 0}.danger{background:#a33136}.muted{color:#a8c2e4}.ok{color:#80e0b2}#message{white-space:pre-wrap}.line{display:flex;justify-content:space-between;gap:8px;align-items:center}.line button{width:auto}#login{max-width:450px;margin:25px auto}h2{font-size:18px}

</style><div id="v4Splash" aria-label="Inicialização HELP-TECH"></div><div id="loginWrap"><div style="width:100%"><h1>✡ GESTÃO HELP-TECH</h1><small>V4.0 • Independente e sincronizável</small></header><main>
<section id="login" class="panel"><img class="brand" src="logo_original.png" alt="Logomarca original HELP-TECH"><h2 id="loginTitle">Acesso</h2><label>Usuário<input id="user" autocomplete="username"></label><label>Senha<input id="password" type="password" autocomplete="current-password"></label><button id="loginButton">Continuar</button><p id="loginMessage" class="muted"></p></section></div></div>

</section>
<div id="moduleScreen" class="hide"><header><button id="goHome">← Início</button><b>GESTÃO HELP-TECH V4.0</b></header><main><section id="workspace"><nav><button data-page="appointments">Agenda</button><button data-page="cash_entries">Fluxo de caixa</button><button data-page="service_profits">Lucro por serviço</button><button data-page="settings">Operações / Rede</button></nav><section class="panel"><h2 id="pageTitle"></h2><div id="formArea"></div><div id="records"></div></section><p id="message" class="muted"></p></section></main></div><script>
'use strict';const $=id=>document.getElementById(id);const STORAGE='helptech_v3_beta_data';let state={appointments:[],cash_entries:[],service_profits:[],queue:[],settings:{url:'',key:''},lastSync:'Nunca',user:null},page='appointments';
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}function load(){try{let a=JSON.parse(localStorage.getItem(STORAGE));if(a&&typeof a==='object')state={...state,...a}}catch(e){}}function id(){return 'v3-'+Date.now()+'-'+Math.random().toString(36).slice(2)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(s){$('message').textContent=s}function fields(){return {appointments:[['client','Cliente','text'],['appt_date','Data','date'],['appt_time','Hora','time'],['address','Endereço','text'],['service','Serviço','text'],['priority','Prioridade','select'],['observations','Observações','text']],cash_entries:[['entry_date','Data','date'],['kind','Tipo','select'],['description','Descrição','text'],['amount','Valor (R$)','number']],service_profits:[['service_date','Data','date'],['client','Cliente','text'],['description','Serviço','text'],['service_value','Valor do serviço','number'],['material_value','Materiais','number'],['expenses','Despesas','number']]}}function title(t){return {appointments:'Agendamentos',cash_entries:'Fluxo de caixa',service_profits:'Lucro por serviço',settings:'Status de operações e rede'}[t]}
async function digest(s){let b=new TextEncoder().encode(s),hash=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(hash)).map(x=>x.toString(16).padStart(2,'0')).join('')}
$('loginButton').onclick=async()=>{let u=$('user').value.trim(),p=$('password').value;if(!u||p.length<6){$('loginMessage').textContent='Informe usuário e senha com pelo menos 6 caracteres.';return}if(!state.user){state.user={name:u,hash:await digest(u+':'+p)};save()}else if(state.user.name!==u||state.user.hash!==await digest(u+':'+p)){$('loginMessage').textContent='Usuário ou senha incorretos.';return}$('loginWrap').classList.add('hide');$('dashboard').classList.remove('hide');document.body.classList.add('home-active');$('moduleScreen').classList.add('hide');updateDashboard()};
function openPendingModule(t){
 const names={clients:'Clientes',budgets:'Orçamentos',orders:'Ordens de Serviço'};
 $('dashboard').classList.add('hide');document.body.classList.remove('home-active');$('moduleScreen').classList.remove('hide');
 $('pageTitle').textContent=names[t];
 $('formArea').innerHTML='<p>Esta página está aprovada visualmente e será implementada na próxima etapa. Nenhum cadastro será simulado ou gravado neste módulo ainda.</p>';
 $('records').innerHTML='';if(t==='budgets'){$('formArea').innerHTML+='<section class="panel"><h2>Impressão térmica 80 mm — teste</h2><p>Enquanto o cadastro completo de orçamentos não estiver implementado, é possível testar a impressão de um orçamento simples.</p><label>Cliente<input id="bClient" placeholder="Nome do cliente"></label><label>Descrição do item<input id="bItem" placeholder="Material ou serviço"></label><label>Quantidade<input id="bQty" type="number" value="1" min="0.01" step="0.01"></label><label>Preço unitário (R$)<input id="bPrice" type="number" value="0" min="0" step="0.01"></label><button id="bPrint">Imprimir orçamento de teste</button></section>';$('bPrint').onclick=()=>{const client=$('bClient').value.trim(),description=$('bItem').value.trim(),qty=Number($('bQty').value),price=Number($('bPrice').value);if(!client||!description||!(qty>0)||price<0||!Number.isFinite(price)){msg('Preencha os dados do orçamento de teste.');return;}printBudgetReceipt({number:'TESTE',client,date:new Date().toLocaleDateString('pt-BR'),items:[{description,qty,price}],validity:'15 dias'});};}msg('Módulo em desenvolvimento na V4.0.');
}
function show(t){if(['clients','budgets','orders'].includes(t)){openPendingModule(t);return}if(t==='sync')t='settings';$('dashboard').classList.add('hide');document.body.classList.remove('home-active');$('moduleScreen').classList.remove('hide');page=t;$('pageTitle').textContent=title(t);if(t==='settings'){renderSettings();return}let html='<form id="recordForm">';for(let [name,label,type] of fields()[t]){html+='<label>'+label+'</label>';if(type==='select'){let opts=name==='priority'?['Média','Baixa','Alta','Urgente']:['Entrada','Saída'];html+='<select name="'+name+'">'+opts.map(o=>'<option>'+o+'</option>').join('')+'</select>'}else html+='<input name="'+name+'" type="'+type+'" '+(type==='number'?'step="0.01" min="0"':'')+'>'}html+='<button type="submit">Salvar no celular</button></form>';$('formArea').innerHTML=html;let form=$('recordForm');for(let f of form.elements)if(f.type==='date')f.value=new Date().toISOString().slice(0,10);form.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form).entries());if(t==='appointments'&&(!d.client||!d.appt_date||!d.appt_time)){msg('Preencha cliente, data e hora.');return}if(t!=='appointments'&&!d.description){msg('Preencha a descrição.');return}if(t==='cash_entries'&&(!d.amount||Number(d.amount)<0)){msg('Informe valor válido.');return}if(t==='service_profits'){for(let k of ['service_value','material_value','expenses'])d[k]=Number(d[k]||0);d.profit=d.service_value-d.material_value-d.expenses}if(t==='cash_entries')d.amount=Number(d.amount);d.id='local-'+id();d._uid=id();state[t].push(d);state.queue.push({uid:d._uid,entity:t,operation:'create',data:d,localId:d.id});save();scheduleAll();updateDashboard();show(t);msg('Salvo offline. Aguardando sincronização.');};renderRecords()}
function renderRecords(){let t=page,rows=state[t]||[];$('records').innerHTML='<h2>Registros ('+rows.length+')</h2>'+rows.map(a=>'<div class="item"><div class="line"><b>'+esc(a.client||a.description||'Registro')+'</b><button class="danger" data-delete="'+esc(a.id)+'">Excluir</button></div><small>'+esc(a.appt_date||a.entry_date||a.service_date||'')+' '+esc(a.appt_time||'')+' • '+esc(a.kind||a.priority||'')+'</small><div>'+esc(a.service||a.description||'')+'</div>'+(t==='appointments'&&a.status!=='Atendido'?'<button data-attended=\"'+esc(a._uid||a.id)+'\">Marcar como atendido</button>':'')+(t==='cash_entries'?'<b>R$ '+Number(a.amount||0).toFixed(2)+'</b>':t==='service_profits'?'<b>Lucro: R$ '+Number(a.profit||0).toFixed(2)+'</b>':'')+'</div>').join('');document.querySelectorAll('[data-attended]').forEach(b=>b.onclick=()=>{if(confirm('Confirmar que o chamado foi atendido?'))markAttended(b.dataset.attended)});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let rec=state[t].find(x=>String(x.id)===b.dataset.delete);if(!rec||!confirm('Excluir definitivamente este registro? Não será possível desfazer.'))return;state[t]=state[t].filter(x=>x!==rec);let pending=state.queue.find(q=>q.entity===t&&q.operation==='create'&&q.localId===rec.id);if(pending){state.queue=state.queue.filter(q=>q!==pending)}else{state.queue.push({uid:id(),entity:t,operation:'delete',record_id:rec.id})}save();scheduleAll();updateDashboard();renderRecords();msg('Exclusão registrada; sincronização pendente, se necessário.')})}
function updateDashboard(){let s=$('dashStatus');if(!s)return;let n=state.queue.length;let upcoming=state.appointments.filter(a=>!['Atendido','Concluído','Cancelado'].includes(a.status)&&new Date(a.appt_date+'T'+a.appt_time)>=new Date()).length;s.textContent=upcoming+' próximos serviços • '+n+' pendência(s) • Última sincronização: '+state.lastSync;s.classList.toggle('warn',n>0)}
function renderSettings(){$('formArea').innerHTML='<label>Endereço do sincronizador (ex.: http://100.x.x.x:8765)</label><input id="server" placeholder="http://IP:8765" value="'+esc(state.settings.url)+'"><label>Chave de sincronização</label><input id="key" type="password" value="'+esc(state.settings.key)+'"><button id="saveSettings">Salvar configurações</button> <button id="sync">Sincronizar agora</button><p id="status"></p>';$('records').innerHTML=`<section class="panel"><h2>🖨 Impressora térmica Bluetooth — 80 mm</h2><p>Primeiro, pareie a impressora nas configurações Bluetooth do Android.</p><button id="printerScan">Buscar dispositivos pareados</button><label>Impressora</label><select id="printerDevices"><option value="">Selecione uma impressora</option></select><label>Largura de impressão</label><select id="printerColumns"><option value="48">80 mm — 48 caracteres</option><option value="32">80 mm — 32 caracteres (fonte maior)</option></select><button id="printerSave">Salvar impressora</button> <button id="printerTest">Imprimir teste</button><p id="printerStatus" class="muted">Nenhuma impressora selecionada.</p><p class="muted">Compatibilidade prevista: ESC/POS via Bluetooth clássico (SPP). Não compatível com todos os modelos BLE/proprietários.</p></section>`;setupPrinterSettings();$('saveSettings').onclick=()=>{state.settings={url:$('server').value.trim().replace(/\/$/,''),key:$('key').value.trim()};save();renderSettings();msg('Configurações de rede salvas permanentemente neste aparelho.')};$('sync').onclick=()=>sync();$('status').innerHTML='Banco local: <b class="ok">Disponível</b><p>Conexão: '+(navigator.onLine?'Rede detectada':'Offline')+'</p><p>Pendências: '+state.queue.length+'</p><p>Última sincronização: '+esc(state.lastSync)+'</p><p>Registros locais: '+(state.appointments.length+state.cash_entries.length+state.service_profits.length)+'</p>'}

function printerStatus(text){const el=$('printerStatus');if(el)el.textContent=text;else msg(text)}
window.helpTechPrinterEvent=(type,value)=>{if(type==='devices'){try{let devices=JSON.parse(value),sel=$('printerDevices');if(!sel)return;sel.innerHTML='<option value="">Selecione uma impressora</option>'+devices.map(d=>'<option value="'+esc(d.address)+'">'+esc(d.name||'Impressora')+' — '+esc(d.address)+'</option>').join('');sel.value=localStorage.getItem('helptech_printer_address')||'';printerStatus(devices.length+' dispositivo(s) pareado(s).')}catch(e){printerStatus('Erro na lista de impressoras.')}}else printerStatus(value)};
function setupPrinterSettings(){const api=window.HelpTechPrinter;if(!api){printerStatus('Recurso disponível somente no aplicativo Android.');return;}const saved=localStorage.getItem('helptech_printer_address')||api.getAddress();printerStatus(saved?'Impressora salva: '+saved:'Nenhuma impressora selecionada.');$('printerScan').onclick=()=>api.listPaired();$('printerSave').onclick=()=>{let address=$('printerDevices').value;if(!address){printerStatus('Selecione uma impressora pareada.');return;}api.saveAddress(address);localStorage.setItem('helptech_printer_address',address);localStorage.setItem('helptech_printer_cols',$('printerColumns').value)};$('printerColumns').value=localStorage.getItem('helptech_printer_cols')||'48';$('printerTest').onclick=()=>printHelpTechReceipt('HELP-TECH\nSEGURANCA ELETRONICA\n==============================\nTESTE DE IMPRESSAO\nImpressora termica 80 mm\nBluetooth ESC/POS\n==============================\n');}
function printHelpTechReceipt(text){if(!window.HelpTechPrinter){msg('Impressão disponível apenas no aplicativo Android.');return;}window.HelpTechPrinter.printReceipt(JSON.stringify({text,columns:Number(localStorage.getItem('helptech_printer_cols')||48)}));}
function printBudgetReceipt(b){const fmt=n=>'R$ '+Number(n||0).toFixed(2).replace('.',',');let lines=['HELP-TECH','SEGURANCA ELETRONICA','================================','ORCAMENTO '+(b.number||''),'Cliente: '+(b.client||''),'Data: '+(b.date||''),'--------------------------------'];let sum=0;for(const i of (b.items||[])){const subtotal=Number(i.qty||0)*Number(i.price||0);sum+=subtotal;lines.push(String(i.description||''),String(i.qty||0)+' x '+fmt(i.price)+' = '+fmt(subtotal));}lines.push('--------------------------------','TOTAL: '+fmt(b.total==null?sum:b.total),'Validade: '+(b.validity||'A combinar'),String(b.notes||''),'================================','Obrigado pela preferencia!');printHelpTechReceipt(lines.join('\n'));}
window.helpTechPrintBudget=printBudgetReceipt;
async function sync(){let {url,key}=state.settings;url=(url||'').trim().replace(/\/+$/,'').replace(/^https?:\/\/https?:\/\//,'http://');if(!url||!key){msg('Configure endereço e chave do servidor.');return}msg('Sincronizando agendamentos...');try{
 let headers={'X-HelpTech-Key':key};
 for(let q of [...state.queue].filter(q=>q.entity==='appointments'&&q.operation==='create')){
  let a=q.data;let body={...a,mobile_id:String(a._uid||q.uid).replace(/[^a-zA-Z0-9-]/g,'').slice(0,80),status:a.status||'Pendente'};
  let r=await fetch(url+'/api/appointments',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.erro||'Falha no envio');let rec=state.appointments.find(x=>x.id===q.localId);if(rec)rec.id=j.id;state.queue=state.queue.filter(x=>x.uid!==q.uid);save();
 }
 let r=await fetch(url+'/api/appointments',{headers});let j=await r.json();if(!r.ok)throw Error(j.erro||'Falha na consulta');
 let pending=state.appointments.filter(a=>state.queue.some(q=>q.entity==='appointments'&&q.operation==='create'&&q.localId===a.id));
 state.appointments=(j.appointments||[]).concat(pending);state.lastSync=new Date().toLocaleString('pt-BR');save();scheduleAll();updateDashboard();renderSettings();msg('Agendamentos sincronizados. Outros módulos permanecem locais até atualização do servidor.');
 }catch(e){msg('Sem sincronização: '+e.message+'. Dados locais preservados.');}}
function scheduleAll(){if(!window.HelpTechAlarm)return;try{let jobs=state.appointments.filter(a=>a.appt_date&&a.appt_time&&!['Concluído','Atendido','Cancelado'].includes(a.status)).map(a=>({id:String(a._uid||a.id),client:a.client||'',service:a.service||'',date:a.appt_date,time:a.appt_time,address:a.address||''}));HelpTechAlarm.schedule(JSON.stringify(jobs))}catch(e){console.log(e)}}
function markAttended(id){let a=state.appointments.find(x=>String(x._uid||x.id)===String(id));if(!a)return;a.status='Atendido';a.attended_at=new Date().toISOString();save();scheduleAll();updateDashboard();if(page==='appointments')renderRecords();msg('Atendimento registrado localmente. A atualização do status no Windows ainda depende de suporte do sincronizador.')}

setTimeout(()=>{const splash=document.getElementById('v4Splash');if(splash)splash.remove()},2000);load();scheduleAll();updateDashboard();$('goHome').onclick=()=>{$('moduleScreen').classList.add('hide');$('dashboard').classList.remove('hide');document.body.classList.add('home-active');updateDashboard()};if($('logout'))$('logout').onclick=()=>{$('dashboard').classList.add('hide');document.body.classList.remove('home-active');$('moduleScreen').classList.add('hide');$('loginWrap').classList.remove('hide');$('password').value=''};document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>show(b.dataset.open));$('loginTitle').textContent=state.user?'Entrar no aplicativo':'Primeiro acesso — criar usuário e senha';document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));window.addEventListener('online',()=>{if(state.settings.url&&state.settings.key)sync()});
</script></html>
